<!doctype html><html lang="en"><head><meta charset="utf-8"><title>AFCO Live Console</title><style>body{font:15px system-ui;margin:2rem;background:#f7fafc;color:#1a202c}main{max-width:1000px;margin:auto}section{background:white;padding:1rem;margin:1rem 0;border-radius:8px;box-shadow:0 1px 4px #ddd}pre{white-space:pre-wrap}button{padding:.5rem 1rem}</style></head><body><main><h1>AFCO Live Console</h1><section><button onclick="run()">Run pending events</button> <button onclick="refresh()">Refresh</button><pre id="state"></pre></section><section><h2>Trace log</h2><pre id="events"></pre></section></main><script>async function refresh(){let s=await fetch('/api/state').then(r=>r.json());let e=await fetch('/api/events').then(r=>r.json());document.querySelector('#state').textContent=JSON.stringify(s,null,2);document.querySelector('#events').textContent=JSON.stringify(e,null,2)}async function run(){await fetch('/api/run',{method:'POST'});refresh()}refresh()</script></body></html>
