adapter:
  vendor: OCPP-2.0.1
  version: "1.0"
  initial_state: Available
states: [Available, Authorizing, Authorized, Connected, Locked, Precharging, Charging, Stopping, Isolating, Unlocked, Unplugged, Billing, Completed]
transitions:
  - {from: Available, event: AuthorizeRequest, to: Authorizing, emit: auth_req}
  - {from: Authorizing, event: AuthorizationAccepted, to: Authorized, emit: auth_ok}
  - {from: Authorized, event: TransactionEventStarted, to: Connected, emit: plug_in}
  - {from: Connected, event: ConnectorLocked, to: Locked, emit: lock_ok}
  - {from: Locked, event: ReadyToCharge, to: Precharging, emit: ev_ready}
  - {from: Precharging, event: ChargingReady, to: Precharging, emit: precharge_ok}
  - {from: Precharging, event: TransactionStarted, to: Charging, emit: power_start}
  - {from: Charging, event: MeterReport, to: Charging, emit: meter_tick}
  - {from: Charging, event: TransactionStopped, to: Stopping, emit: power_ramp_down}
  - {from: Stopping, event: CurrentZero, to: Isolating, emit: power_stop}
  - {from: Isolating, event: ContactorOpen, to: Unlocked, emit: contactors_open}
  - {from: Unlocked, event: CableRemoved, to: Unplugged, emit: unplug}
  - {from: Unplugged, event: FinalMeterReport, to: Billing, emit: meter_final}
  - {from: Billing, event: PaymentConfirmed, to: Completed, emit: pay_ok}
  - {from: Completed, event: TransactionClosed, to: Completed, emit: session_close}
  - {from: Completed, event: Reset, to: Available, emit: reset_cmd}
